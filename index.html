<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur — Your Playlists</title>

<!-- iOS "Add to Home Screen" standalone app hints -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sur">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0A0A0A;
    --surface:#141414;
    --surface-hi:#1E1E1E;
    --line:#262626;
    --text:#F5F5F5;
    --muted:#8A8A8A;
    --green:#1ED760;
    --hindi:#FF6B4A;
    --kannada:#FFC93F;
    --all:#1ED760;
    --accent: var(--green);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:#000; }

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  /* ---------- HEADER ---------- */
  header{
    padding:28px 28px 18px;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:22px;
  }
  .brand .mark{
    font-family:'Archivo Black',sans-serif;
    font-size:26px;
    letter-spacing:-0.02em;
  }
  .brand .tag{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.14em;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    padding:9px 18px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.01em;
    cursor:pointer;
    transition:all .18s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tab .dot{
    width:7px; height:7px; border-radius:50%;
    background:currentColor;
    opacity:.55;
  }
  .tab:hover{ color:var(--text); border-color:#3a3a3a; }
  .tab.active{
    background:var(--tab-color, var(--accent));
    color:#08130B;
    border-color:transparent;
  }
  .tab.active .dot{ opacity:1; }

  /* ---------- TRACK LIST ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:6px 16px 140px;
  }
  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:#2b2b2b; border-radius:8px; }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 12px 8px;
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.12em;
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .row:hover{ background:var(--surface); }
  .row.playing{ background:var(--surface-hi); }

  .row .idx{
    width:20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .row.playing .idx{ color:var(--accent-track,var(--accent)); }

  .eq{
    display:flex;
    align-items:flex-end;
    gap:2px;
    width:14px;
    height:14px;
    margin:0 auto;
  }
  .eq span{
    width:3px;
    background:var(--accent-track,var(--accent));
    border-radius:1px;
    animation:eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay:-0.6s; }
  .eq span:nth-child(2){ animation-delay:-0.3s; }
  .eq span:nth-child(3){ animation-delay:0s; }
  @keyframes eq{
    0%,100%{ height:3px; }
    50%{ height:14px; }
  }
  .row.paused .eq span{ animation-play-state:paused; height:3px; }

  .thumb{
    width:44px; height:44px;
    border-radius:6px;
    background:var(--surface-hi);
    flex-shrink:0;
    object-fit:cover;
  }

  .meta{
    min-width:0;
    flex:1;
  }
  .meta .title{
    font-size:14.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row.playing .meta .title{ color:var(--accent-track,var(--accent)); }
  .meta .artist{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }

  .empty, .skeleton-wrap{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .skel{
    height:44px;
    background:linear-gradient(90deg, var(--surface) 25%, var(--surface-hi) 37%, var(--surface) 63%);
    background-size:400% 100%;
    border-radius:8px;
    margin:6px 12px;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{
    0%{ background-position:100% 0; }
    100%{ background-position:0 0; }
  }

  /* ---------- PLAYER BAR ---------- */
  .player{
    position:fixed;
    left:0; right:0; bottom:0;
    background:rgba(10,10,10,0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:14px;
  }
  .player .thumb{
    width:48px; height:48px; border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .player .np{
    min-width:0;
    flex:1;
  }
  .player .np .title{
    font-size:13.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player .np .artist{
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .ctl-btn{
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:.85;
    transition:opacity .15s, transform .1s;
  }
  .ctl-btn:hover{ opacity:1; }
  .ctl-btn:active{ transform:scale(0.9); }
  .ctl-btn.play{
    background:var(--accent);
    color:#08130B;
    border-radius:50%;
    width:40px; height:40px;
    opacity:1;
  }
  .ctl-btn svg{ width:18px; height:18px; fill:currentColor; }
  .ctl-btn.play svg{ width:17px; height:17px; }

  #yt-player{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  @media (max-width:520px){
    header{ padding:20px 16px 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <span class="mark">Sur</span>
      <span class="tag">Hindi · Kannada · All songs</span>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <main id="main"></main>

  <div class="player">
    <img class="thumb" id="np-thumb" src="" alt="">
    <div class="np">
      <div class="title" id="np-title">Pick a track to start</div>
      <div class="artist" id="np-artist">—</div>
    </div>
    <div class="controls">
      <button class="ctl-btn" id="prev-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l10.5 6V6z"/></svg>
      </button>
      <button class="ctl-btn play" id="play-btn" aria-label="Play">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl-btn" id="next-btn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4.5 18l10.5-6-10.5-6z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="yt-player"></div>

<script>
  const PLAYLISTS = [
    { id: 'https://www.youtube.com/watch?v=KQ5oWUygSK0&list=PLJQleqNYzjsA', name: 'Hindi',     color: 'var(--hindi)' },
    { id: 'https://www.youtube.com/watch?v=EpWzjiLS2Rg&list=PLIcMNJE9Jy02bkSjfPArcKzumCsSf6es5', name: 'Kannada',  color: 'var(--kannada)' },
    { id: 'https://www.youtube.com/watch?v=16y1AkoZkmQ&list=PLIcMNJE9Jy01RpjrBYnspCTxt2_7moh4Z', name: 'All Songs', color: 'var(--all)' },
  ];

  let player, currentTab = 0, currentIds = [], meta = {}, isPlaying = false, activeIndex = -1;
  const cache = {}; // playlist videoId arrays cache

  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main'); 
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const npTitle = document.getElementById('np-title');
  const npArtist = document.getElementById('np-artist');
  const npThumb = document.getElementById('np-thumb');

  function renderTabs(){
    tabsEl.innerHTML = PLAYLISTS.map((p,i)=>`
      <button class="tab ${i===currentTab?'active':''}" style="--tab-color:${p.color}" data-i="${i}">
        <span class="dot"></span>${p.name}
      </button>`).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=> switchTab(parseInt(btn.dataset.i)));
    });
  }

  function switchTab(i){
    currentTab = i;
    renderTabs();
    loadTab(i);
  }

  function skeletonUI(){
    mainEl.innerHTML = `<div class="list-head"><span>Track</span><span></span></div>` +
      Array.from({length:8}).map(()=>'<div class="skel"></div>').join('');
  }

  function onYouTubeIframeAPIReady(){
    player = new YT.Player('yt-player', {
      height: '0', width: '0',
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: ()=> loadTab(currentTab),
        onStateChange: onPlayerState,
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function normalizePlaylistId(input){
    const value = String(input || '').trim();
    try {
      const url = new URL(value);
      return url.searchParams.get('list') || value;
    } catch {
      return value.split('&')[0].split('?')[0];
    }
  }

  function loadTab(i){
    const pl = PLAYLISTS[i];
    const playlistId = normalizePlaylistId(pl.id);
    skeletonUI();
    if (cache[playlistId]){
      currentIds = cache[playlistId];
      renderList(pl, currentIds);
      return;
    }
    if (!player || !player.cuePlaylist){ return; }
    player.cuePlaylist({ listType: 'playlist', list: playlistId });

    let tries = 0;
    const poll = setInterval(()=>{
      tries++;
      const ids = player.getPlaylist ? player.getPlaylist() : null;
      if (ids && ids.length){
        clearInterval(poll);
        currentIds = ids;
        cache[playlistId] = ids;
        renderList(pl, ids);
      } else if (tries > 40){
        clearInterval(poll);
        mainEl.innerHTML = `<div class="empty">Couldn't load this playlist. It may be private or unavailable.</div>`;
      }
    }, 250);
  }

  function renderList(pl, ids){
    mainEl.innerHTML = `<div class="list-head"><span>#</span><span></span></div>` +
      ids.map((id, idx)=>`
        <div class="row paused" data-idx="${idx}" data-id="${id}">
          <span class="idx">
            <span class="num">${idx+1}</span>
            <span class="eq" style="display:none"><span></span><span></span><span></span></span>
          </span>
          <img class="thumb" src="https://i.ytimg.com/vi/${id}/default.jpg" loading="lazy">
          <div class="meta">
            <div class="title" data-t>Loading…</div>
            <div class="artist" data-a>—</div>
          </div>
        </div>`).join('');

    mainEl.querySelectorAll('.row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const idx = parseInt(row.dataset.idx);
        player.playVideoAt(idx);
      });
    });

    highlightPlaying();
    fetchMeta(ids, pl.color);
  }

  function fetchMeta(ids, color){
    ids.forEach((id, idx)=>{
      if (meta[id]){
        fillRow(id, idx, meta[id]);
        return;
      }
      fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
        .then(r => r.ok ? r.json() : null)
        .then(data=>{
          if (!data) return;
          meta[id] = { title: data.title, author: data.author_name };
          fillRow(id, idx, meta[id]);
          if (activeIndex === idx && currentIds[idx] === id) updateNowPlaying();
        })
        .catch(()=>{});
    });
  }

  function fillRow(id, idx, m){
    const row = mainEl.querySelector(`.row[data-idx="${idx}"]`);
    if (!row) return;
    const t = row.querySelector('[data-t]');
    const a = row.querySelector('[data-a]');
    if (t) t.textContent = m.title;
    if (a) a.textContent = m.author;
  }

  function highlightPlaying(){
    mainEl.querySelectorAll('.row').forEach(row=>{
      const idx = parseInt(row.dataset.idx);
      const active = idx === activeIndex;
      row.classList.toggle('playing', active);
      row.classList.toggle('paused', active && !isPlaying);
      const num = row.querySelector('.num');
      const eq = row.querySelector('.eq');
      if (num) num.style.display = active ? 'none' : 'inline';
      if (eq) eq.style.display = active ? 'flex' : 'none';
      row.style.setProperty('--accent-track', PLAYLISTS[currentTab].color);
    });
  }

  function updateNowPlaying(){
    const id = currentIds[activeIndex];
    if (!id) return;
    const m = meta[id];
    npTitle.textContent = m ? m.title : 'Loading…';
    npArtist.textContent = m ? m.author : '—';
    npThumb.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

    if ('mediaSession' in navigator && m){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: m.title,
        artist: m.author,
        album: PLAYLISTS[currentTab].name,
        artwork: [{ src: npThumb.src, sizes: '320x180', type: 'image/jpeg' }]
      });
    }
  }

  function onPlayerState(e){
    if (e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      activeIndex = player.getPlaylistIndex();
      playIcon.setAttribute('d','M6 5h4v14H6zm8 0h4v14h-4z');
      updateNowPlaying();
      highlightPlaying();
    } else if (e.data === YT.PlayerState.PAUSED){
      isPlaying = false;
      playIcon.setAttribute('d','M8 5v14l11-7z');
      highlightPlaying();
    } else if (e.data === YT.PlayerState.CUED){
      activeIndex = player.getPlaylistIndex ? player.getPlaylistIndex() : -1;
    }
  }

  playBtn.addEventListener('click', ()=>{
    if (!player || !player.getPlayerState) return;
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) player.pauseVideo();
    else player.playVideo();
  });
  prevBtn.addEventListener('click', ()=> player && player.previousVideo && player.previousVideo());
  nextBtn.addEventListener('click', ()=> player && player.nextVideo && player.nextVideo());

  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', ()=> player && player.playVideo());
    navigator.mediaSession.setActionHandler('pause', ()=> player && player.pauseVideo());
    navigator.mediaSession.setActionHandler('previoustrack', ()=> player && player.previousVideo());
    navigator.mediaSession.setActionHandler('nexttrack', ()=> player && player.nextVideo());
  }

  renderTabs();
  skeletonUI();

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  // Register service worker (installable PWA)
  if ('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
