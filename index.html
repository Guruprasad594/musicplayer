<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sur - YouTube Playlists</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sur">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
  :root{
    --bg:#101010;
    --panel:#171717;
    --panel-2:#202020;
    --line:#2d2d2d;
    --line-soft:#242424;
    --text:#f6f2ea;
    --muted:#a59f95;
    --weak:#746f68;
    --accent:#ff7448;
    --accent-ink:#160805;
    --warn:#f3c04d;
    --ok:#47d18c;
    --radius:8px;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(circle at top left, rgba(255,116,72,.14), transparent 28rem),
      radial-gradient(circle at bottom right, rgba(65,196,135,.1), transparent 24rem),
      var(--bg);
    color:var(--text);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-font-smoothing:antialiased;
  }

  button,input{font:inherit}
  button{color:inherit}
  img{display:block}

  .app{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:18px 22px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background:rgba(16,16,16,.78);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    flex-shrink:0;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }

  .mark{
    font-size:30px;
    line-height:1;
    font-weight:900;
    letter-spacing:0;
  }

  .scope{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.14em;
    white-space:nowrap;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    max-width:64vw;
  }
  .tabs::-webkit-scrollbar{display:none}

  .tab{
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    min-height:38px;
    padding:0 16px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    transition:background .16s ease, border-color .16s ease, color .16s ease, transform .12s ease;
  }
  .tab:hover{background:rgba(255,255,255,.08); color:var(--text)}
  .tab:active{transform:translateY(1px)}
  .tab[aria-selected="true"]{
    background:var(--tab-accent);
    border-color:transparent;
    color:#120806;
  }
  .tab-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:currentColor;
    opacity:.72;
    flex:0 0 auto;
  }

  .layout{
    flex:1;
    min-height:auto;
    display:flex;
    flex-direction:column;
    padding:12px 18px 152px;
  }

  .stage,
  .queue{
    min-width:0;
    min-height:0;
    background:rgba(23,23,23,.88);
    border:1px solid rgba(255,255,255,.07);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 18px 48px rgba(0,0,0,.22);
  }

  .stage{
    display:block;
    height:0;
    min-height:0;
    overflow:visible;
    background:transparent;
    border:0;
    border-radius:0;
    box-shadow:none;
  }

  .now-art{
    position:relative;
    width:68px;
    aspect-ratio:16 / 9;
    border-radius:6px;
    overflow:hidden;
    background:var(--panel-2);
    flex-shrink:0;
  }

  .player-frame{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#060606;
    min-height:0;
  }

  #yt-player,
  #yt-player iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  .player-cover{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:6px;
    text-align:center;
    background:
      linear-gradient(135deg, rgba(255,116,72,.18), transparent 38%),
      linear-gradient(315deg, rgba(71,209,140,.14), transparent 42%),
      #0b0b0b;
    color:var(--muted);
    font-size:8px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    z-index:2;
  }
  .player-cover[hidden]{display:none}
  .player-cover.error{color:#ffd9c9}

  .ios-hint{
    display:none;
    grid-column:1 / -1;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    line-height:1.35;
  }
  .ios-hint.is-on{display:block}

  .nowbar{
    position:fixed;
    left:50%;
    right:auto;
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:20;
    width:min(1040px, calc(100vw - 32px));
    transform:translateX(-50%);
    display:grid;
    grid-template-columns:auto minmax(0, 1fr) auto;
    align-items:center;
    gap:14px;
    padding:14px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius);
    background:rgba(18,18,18,.96);
    box-shadow:0 18px 52px rgba(0,0,0,.5);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .now-thumb{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
    background:var(--panel-2);
    z-index:1;
    pointer-events:none;
  }
  .now-thumb.is-hidden{opacity:0}

  .now-copy{min-width:0}
  .eyebrow{
    display:block;
    color:var(--weak);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.14em;
    margin-bottom:4px;
  }
  .now-title{
    font-size:17px;
    line-height:1.25;
    font-weight:900;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .now-artist{
    color:var(--muted);
    font-size:13px;
    line-height:1.35;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    margin-top:2px;
  }

  .progress-row{
    grid-column:2 / -1;
    display:grid;
    grid-template-columns:44px minmax(0, 1fr) 44px;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .seek{
    width:100%;
    accent-color:var(--accent);
    cursor:pointer;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:50%;
    background:rgba(255,255,255,.05);
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:background .16s ease, border-color .16s ease, transform .12s ease, opacity .16s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,.1); border-color:#444}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn:disabled{cursor:not-allowed; opacity:.38}
  .icon-btn.primary{
    width:50px;
    height:50px;
    background:var(--accent);
    border-color:transparent;
    color:var(--accent-ink);
  }
  .icon-btn svg{
    width:20px;
    height:20px;
    fill:currentColor;
  }

  .queue{
    display:flex;
    flex-direction:column;
    flex:1;
    overflow:visible;
  }

  .queue-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    padding:16px 16px 12px;
    border-bottom:1px solid var(--line-soft);
  }
  .queue-title{
    display:block;
    font-size:22px;
    line-height:1.1;
    font-weight:900;
  }
  .count{
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    padding-bottom:2px;
  }

  .tools{
    display:flex;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid var(--line-soft);
  }
  .search{
    min-width:0;
    flex:1;
    height:42px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.04);
  }
  .search svg{
    width:17px;
    height:17px;
    stroke:var(--weak);
    flex:0 0 auto;
  }
  .search input{
    min-width:0;
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-size:14px;
  }
  .search input::placeholder{color:var(--weak)}

  .status{
    min-height:34px;
    padding:9px 16px;
    color:var(--muted);
    border-bottom:1px solid var(--line-soft);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.11em;
  }
  .status.warn{color:var(--warn)}
  .status.error{color:#ff9f82}
  .status.ok{color:var(--ok)}

  .track-list{
    flex:0 0 auto;
    min-height:0;
    overflow:visible;
    padding:8px 8px 16px;
  }
  .track-list::-webkit-scrollbar{width:10px}
  .track-list::-webkit-scrollbar-thumb{background:#333; border-radius:10px; border:3px solid var(--panel)}

  .track-row{
    width:100%;
    min-height:72px;
    border:0;
    border-radius:var(--radius);
    background:transparent;
    display:grid;
    grid-template-columns:34px 76px minmax(0, 1fr);
    align-items:center;
    gap:12px;
    padding:8px;
    cursor:pointer;
    text-align:left;
    transition:background .14s ease, color .14s ease;
  }
  .track-row:hover{background:rgba(255,255,255,.055)}
  .track-row.active{background:rgba(255,255,255,.09)}
  .track-row.unavailable{opacity:.55}

  .track-index{
    color:var(--weak);
    text-align:center;
    font-size:12px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .track-row.active .track-index{color:var(--accent)}

  .bars{
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:flex-end;
    justify-content:center;
    gap:2px;
  }
  .bars span{
    width:3px;
    min-height:4px;
    border-radius:2px;
    background:var(--accent);
    animation:pulse .82s ease-in-out infinite;
  }
  .bars span:nth-child(2){animation-delay:.12s}
  .bars span:nth-child(3){animation-delay:.24s}
  .track-row.paused .bars span{animation-play-state:paused; height:4px}
  @keyframes pulse{
    0%,100%{height:4px}
    50%{height:17px}
  }

  .track-thumb{
    width:76px;
    aspect-ratio:16 / 9;
    object-fit:cover;
    border-radius:6px;
    background:var(--panel-2);
  }
  .track-main{min-width:0; overflow:hidden}
  .track-title{
    font-size:14px;
    line-height:1.25;
    font-weight:850;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .track-row.active .track-title{color:var(--accent)}
  .track-artist{
    color:var(--muted);
    font-size:12px;
    line-height:1.35;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    margin-top:3px;
  }
  .track-badge{
    display:none;
  }
  .track-row.active .track-badge{
    color:var(--accent);
    border-color:color-mix(in srgb, var(--accent), transparent 55%);
  }

  .empty,
  .skeleton{
    display:grid;
    place-items:center;
    min-height:180px;
    padding:26px;
    color:var(--muted);
    text-align:center;
    font-size:14px;
    font-weight:750;
  }

  .skeleton-stack{
    padding:8px;
  }
  .skel-row{
    height:72px;
    border-radius:var(--radius);
    margin-bottom:8px;
    background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04));
    background-size:220% 100%;
    animation:shimmer 1.2s ease infinite;
  }
  @keyframes shimmer{
    0%{background-position:100% 0}
    100%{background-position:0 0}
  }

  @media (max-width:900px){
    body{overflow:auto}
    .app{min-height:100vh}
    .topbar{
      align-items:flex-start;
      flex-direction:column;
      padding:16px;
    }
    .tabs{max-width:100%; width:100%}
    .layout{
      padding:12px 12px 132px;
      min-height:auto;
    }
    .queue{min-height:520px}
  }

  @media (max-width:560px){
    .scope{display:none}
    .topbar{
      gap:12px;
      padding:12px 10px 10px;
    }
    .mark{font-size:28px}
    .tab{
      min-height:34px;
      padding:0 12px;
      font-size:12px;
    }
    .layout{padding:8px 8px 148px}
    .queue{
      min-height:auto;
      border-radius:6px;
    }
    .queue-head{
      padding:12px 12px 10px;
    }
    .tools{
      padding:10px 12px;
    }
    .status{
      min-height:30px;
      padding:8px 12px;
      font-size:11px;
    }
    .nowbar{
      grid-template-columns:48px minmax(0, 1fr) auto;
      gap:8px;
      padding:10px;
      width:calc(100vw - 20px);
      bottom:calc(10px + env(safe-area-inset-bottom));
    }
    .now-art{width:48px}
    .eyebrow{display:none}
    .now-title{font-size:14px}
    .now-artist{font-size:12px}
    .controls{
      grid-column:auto;
      justify-content:flex-end;
      gap:5px;
    }
    .icon-btn{
      width:34px;
      height:34px;
    }
    .icon-btn.primary{
      width:40px;
      height:40px;
    }
    .icon-btn svg{
      width:17px;
      height:17px;
    }
    .progress-row{
      grid-column:1 / -1;
      grid-template-columns:36px minmax(0, 1fr) 36px;
      gap:8px;
      font-size:11px;
    }
    .track-row{
      min-height:62px;
      grid-template-columns:24px 56px minmax(0, 1fr);
      gap:8px;
      padding:7px;
    }
    .track-thumb{width:56px}
    .track-title{font-size:13px}
    .track-artist{font-size:11px}
    .track-badge{display:none}
    .queue-head{align-items:flex-start}
    .queue-title{font-size:20px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">Sur</span>
      <span class="scope">YouTube playlists</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Playlists"></nav>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Player">
      <div class="nowbar">
        <div class="now-art">
          <div class="player-frame">
            <div id="yt-player"></div>
            <div class="player-cover" id="player-cover">Connecting to YouTube</div>
          </div>
          <img class="now-thumb" id="now-thumb" alt="" src="">
        </div>
        <div class="now-copy">
          <span class="eyebrow" id="now-label">Now selected</span>
          <div class="now-title" id="now-title">Loading playlist</div>
          <div class="now-artist" id="now-artist">YouTube</div>
        </div>
        <div class="controls">
          <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zm3 7 10-7v14z"></path></svg>
          </button>
          <button class="icon-btn primary" id="play-btn" type="button" aria-label="Play" title="Play">
            <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <button class="icon-btn" id="next-btn" type="button" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM5 19V5l10 7z"></path></svg>
          </button>
        </div>
        <div class="progress-row">
          <span id="current-time">0:00</span>
          <input class="seek" id="seek-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>
        <p class="ios-hint" id="ios-hint">iPhone Chrome pauses YouTube when you leave the app. Keep this tab open, or use Safari.</p>
      </div>
    </section>

    <aside class="queue" aria-label="Queue">
      <div class="queue-head">
        <div>
          <span class="eyebrow">Queue</span>
          <strong class="queue-title" id="playlist-title">Hindi</strong>
        </div>
        <span class="count" id="track-count">0 tracks</span>
      </div>

      <div class="tools">
        <label class="search" aria-label="Search queue">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2"><path d="m21 21-4.3-4.3"></path><circle cx="11" cy="11" r="7"></circle></svg>
          <input id="search-input" type="search" placeholder="Search tracks" autocomplete="off">
        </label>
      </div>

      <div class="status" id="status">Connecting</div>
      <div class="track-list" id="track-list"></div>
    </aside>
  </main>
</div>

<script>
  const PLAYLISTS = [
    { id: 'https://www.youtube.com/watch?v=KQ5oWUygSK0&list=PLJQleqNYzjsA', name: 'Hindi', color: '#ff7448' },
    {
      id: 'https://www.youtube.com/watch?v=EpWzjiLS2Rg&list=PLIcMNJE9Jy02bkSjfPArcKzumCsSf6es5',
      name: 'Kannada',
      color: '#f3c04d',
      tracks: ['EpWzjiLS2Rg', 'ID6CEj7t4Us', 'labVkcSBX68', 'qyoKUPJX63k', 'Mfv-zseDd90', 'ksANu45I16U', 'k7QJbycs_nE', 'p3BNPcd66rA', 'NW8SnpSzH8k', 'e4h0VoZpdI8', '63PTx_1WEq4', '99138T2WeOQ', '-38NkwtdjVo', '1OTTa47yV0w', 'pd7cp6gQKac', 'QrzM1amZUsg', 'Gf-cxRMVEBU', 'pxCWiYFkvTg'],
    },
    {
      id: 'https://www.youtube.com/watch?v=16y1AkoZkmQ&list=PLIcMNJE9Jy01RpjrBYnspCTxt2_7moh4Z',
      name: 'All Songs',
      color: '#47d18c',
      tracks: ['16y1AkoZkmQ', 'SS3lIQdKP-A', 'SJ5B9SW4ONQ', 'jlmyZ_x5vjc', 'i1o1p_DD6TU', 'zWEOx7TSM6I', '6k8Aja80GQM', '1gukvtH_a3I', 'iv7lcUkFVSc', 'dKYH8-9mLlQ', 'QNJL6nfu__Q', 'tThJdNt-_5I', 'z65MTQQjgjg', 'y83x7MgzWOA', 'IngvLGgX-YU', '2egn2ssP7MM', 'hhdSyBHuI88', 'hXh35CtnSyU', 'WupTfpXdun0', '29YRI-6low0', 'xE9FBL7jUGA', 'JGwWNGJdvx8', '4NRXx6U8ABQ', '7wtfhZwyrcc', 'VOLKJJvfAbg', '7LSOgn6APzE', 'ldLSmUwyL34', 'dESIGVxSSCE', 'OVHkruv-dg8', 'YVdsmoQgGHM', 'YyepU5ztLf4', 'WK_PlcL8Tzo', 'TkLkStcQ0o4', '3_kVMDG-k5M'],
    },
  ];

  const state = {
    player: null,
    apiReady: false,
    playerReady: false,
    playlistIndex: 0,
    videoIds: [],
    tracks: new Map(),
    activeIndex: -1,
    isPlaying: false,
    shouldPlay: false,
    isLoading: true,
    query: '',
    loadToken: 0,
    pollTimer: 0,
    progressTimer: 0,
    loadedVideoId: '',
    isSeeking: false,
    statusKind: '',
    statusText: 'Connecting',
  };

  window.__surErrors = [];
  window.addEventListener('error', event => {
    window.__surErrors.push(event.message || 'Error');
  });
  window.addEventListener('unhandledrejection', event => {
    window.__surErrors.push(String(event.reason || 'Unhandled rejection'));
  });

  const els = {
    tabs: document.getElementById('tabs'),
    cover: document.getElementById('player-cover'),
    nowThumb: document.getElementById('now-thumb'),
    nowLabel: document.getElementById('now-label'),
    nowTitle: document.getElementById('now-title'),
    nowArtist: document.getElementById('now-artist'),
    playBtn: document.getElementById('play-btn'),
    playIcon: document.getElementById('play-icon'),
    prevBtn: document.getElementById('prev-btn'),
    nextBtn: document.getElementById('next-btn'),
    currentTime: document.getElementById('current-time'),
    duration: document.getElementById('duration'),
    seekBar: document.getElementById('seek-bar'),
    playlistTitle: document.getElementById('playlist-title'),
    trackCount: document.getElementById('track-count'),
    searchInput: document.getElementById('search-input'),
    status: document.getElementById('status'),
    iosHint: document.getElementById('ios-hint'),
    trackList: document.getElementById('track-list'),
  };

  function normalizePlaylistId(input){
    const value = String(input || '').trim().replaceAll('&amp;', '&');
    try {
      const url = new URL(value);
      return url.searchParams.get('list') || value;
    } catch {
      return value.split('&')[0].split('?')[0];
    }
  }

  function currentPlaylist(){
    return PLAYLISTS[state.playlistIndex];
  }

  function currentPlaylistId(){
    return normalizePlaylistId(currentPlaylist().id);
  }

  function seededTrackIds(){
    return currentPlaylist().tracks || [];
  }

  function thumbnail(id, quality = 'mqdefault'){
    return id ? `https://i.ytimg.com/vi/${id}/${quality}.jpg` : '';
  }

  function fallbackTrack(id, index){
    return {
      id,
      title: `Track ${index + 1}`,
      author: currentPlaylist().name,
      ready: false,
      unavailable: false,
    };
  }

  function getTrack(id, index){
    return state.tracks.get(id) || fallbackTrack(id, index);
  }

  function setAccent(color){
    document.documentElement.style.setProperty('--accent', color);
  }

  function setStatus(text, kind = ''){
    state.statusText = text;
    state.statusKind = kind;
    els.status.textContent = text;
    els.status.className = `status ${kind}`.trim();
  }

  function showPlayerMessage(text, kind = ''){
    if (!text){
      els.cover.hidden = true;
      els.cover.textContent = '';
      els.cover.className = 'player-cover';
      return;
    }
    els.cover.hidden = false;
    els.cover.textContent = text;
    els.cover.className = `player-cover ${kind}`.trim();
  }

  function renderTabs(){
    els.tabs.replaceChildren();
    PLAYLISTS.forEach((playlist, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab';
      button.style.setProperty('--tab-accent', playlist.color);
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-selected', String(index === state.playlistIndex));
      button.dataset.index = String(index);

      const dot = document.createElement('span');
      dot.className = 'tab-dot';

      button.append(dot, document.createTextNode(playlist.name));
      button.addEventListener('click', () => loadPlaylist(index));
      els.tabs.append(button);
    });
  }

  function renderShell(){
    const playlist = currentPlaylist();
    setAccent(playlist.color);
    els.playlistTitle.textContent = playlist.name;
    els.trackCount.textContent = `${state.videoIds.length} ${state.videoIds.length === 1 ? 'track' : 'tracks'}`;
    els.prevBtn.disabled = !state.playerReady || !state.videoIds.length;
    els.playBtn.disabled = !state.playerReady || (!state.videoIds.length && !state.isLoading);
    els.nextBtn.disabled = !state.playerReady || !state.videoIds.length;
    renderTabs();
    updateNowPlaying();
  }

  function renderLoadingRows(){
    const wrap = document.createElement('div');
    wrap.className = 'skeleton-stack';
    for (let i = 0; i < 7; i += 1){
      const row = document.createElement('div');
      row.className = 'skel-row';
      wrap.append(row);
    }
    els.trackList.replaceChildren(wrap);
  }

  function renderEmpty(text){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = text;
    els.trackList.replaceChildren(empty);
  }

  function renderTracks(){
    if (state.isLoading){
      renderLoadingRows();
      return;
    }

    if (!state.videoIds.length){
      renderEmpty('No tracks loaded');
      return;
    }

    const query = state.query.trim().toLowerCase();
    const rows = state.videoIds
      .map((id, index) => ({ id, index, track: getTrack(id, index) }))
      .filter(({ index, track }) => {
        if (!query) return true;
        const haystack = `${index + 1} ${track.title} ${track.author}`.toLowerCase();
        return haystack.includes(query);
      });

    if (!rows.length){
      renderEmpty('No matching tracks');
      return;
    }

    const fragment = document.createDocumentFragment();
    rows.forEach(({ id, index, track }) => {
      const isActive = index === state.activeIndex;
      const row = document.createElement('button');
      row.type = 'button';
      row.className = [
        'track-row',
        isActive ? 'active' : '',
        isActive && !state.isPlaying ? 'paused' : '',
        track.unavailable ? 'unavailable' : '',
      ].filter(Boolean).join(' ');
      row.style.setProperty('--accent', currentPlaylist().color);
      row.dataset.index = String(index);
      row.setAttribute('aria-label', `Play ${track.title}`);

      const indexCell = document.createElement('span');
      indexCell.className = 'track-index';
      if (isActive){
        const bars = document.createElement('span');
        bars.className = 'bars';
        bars.append(document.createElement('span'), document.createElement('span'), document.createElement('span'));
        indexCell.append(bars);
      } else {
        indexCell.textContent = String(index + 1).padStart(2, '0');
      }

      const image = document.createElement('img');
      image.className = 'track-thumb';
      image.alt = '';
      image.loading = 'lazy';
      image.src = thumbnail(id);

      const main = document.createElement('span');
      main.className = 'track-main';

      const title = document.createElement('span');
      title.className = 'track-title';
      title.textContent = track.title;

      const author = document.createElement('span');
      author.className = 'track-artist';
      author.textContent = track.author;

      main.append(title, author);

      const badge = document.createElement('span');
      badge.className = 'track-badge';
      badge.textContent = track.unavailable ? 'Unavailable' : isActive ? 'Active' : currentPlaylist().name;

      row.append(indexCell, image, main, badge);
      row.addEventListener('click', () => playTrack(index));
      fragment.append(row);
    });

    els.trackList.replaceChildren(fragment);
  }

  function setPlayIcon(){
    const path = state.isPlaying
      ? 'M6 5h4v14H6zm8 0h4v14h-4z'
      : 'M8 5v14l11-7z';
    els.playIcon.innerHTML = `<path d="${path}"></path>`;
    els.playBtn.setAttribute('aria-label', state.isPlaying ? 'Pause' : 'Play');
    els.playBtn.title = state.isPlaying ? 'Pause' : 'Play';
    syncMediaSessionPlaybackState();
  }

  function updateNowPlaying(){
    const id = state.videoIds[state.activeIndex] || state.videoIds[0];
    const track = id ? getTrack(id, Math.max(state.activeIndex, 0)) : null;
    els.nowLabel.textContent = state.isPlaying ? 'Now playing' : 'Now selected';
    els.nowTitle.textContent = track ? track.title : state.isLoading ? 'Loading playlist' : 'Pick a track';
    els.nowArtist.textContent = track ? track.author : 'YouTube';
    els.nowThumb.src = id ? thumbnail(id) : '';
    els.nowThumb.classList.toggle('is-hidden', state.isPlaying);
    setPlayIcon();

    if ('mediaSession' in navigator && track && id){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.author,
        album: currentPlaylist().name,
        artwork: [{ src: thumbnail(id), sizes: '320x180', type: 'image/jpeg' }],
      });
    }
  }

  function syncMediaSessionPlaybackState(){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.playbackState = state.videoIds.length
      ? state.isPlaying ? 'playing' : 'paused'
      : 'none';
  }

  function claimPlaybackSession(){
    try {
      if ('audioSession' in navigator) navigator.audioSession.type = 'playback';
    } catch {
      window.__surErrors.push('Could not set audio session');
    }
  }

  function resumePlaybackIfNeeded(){
    if (!state.shouldPlay || !state.playerReady || !state.player) return;
    claimPlaybackSession();
    try {
      if (state.player.playVideo) state.player.playVideo();
    } catch {
      window.__surErrors.push('Could not resume playback');
    }
  }

  function enableBackgroundPlayback(){
    claimPlaybackSession();
    try {
      const iframe = state.player && state.player.getIframe ? state.player.getIframe() : null;
      if (iframe){
        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        iframe.setAttribute('playsinline', 'true');
        iframe.setAttribute('webkit-playsinline', 'true');
      }
    } catch {
      window.__surErrors.push('Could not enable background playback hints');
    }
    syncMediaSessionPlaybackState();
  }

  function repaint(){
    renderShell();
    renderTracks();
  }

  function resetPlayerElement(){
    if (state.player && state.player.destroy){
      try {
        state.player.destroy();
      } catch {
        window.__surErrors.push('Could not destroy previous player');
      }
    }

    const frame = document.querySelector('.player-frame');
    const oldPlayer = document.getElementById('yt-player');
    if (oldPlayer) oldPlayer.remove();

    const holder = document.createElement('div');
    holder.id = 'yt-player';
    frame.insertBefore(holder, els.cover);
    state.player = null;
    state.playerReady = false;
  }

  function createPlayerForPlaylist(token){
    if (!state.apiReady || !window.YT || !window.YT.Player){
      setStatus('Connecting');
      showPlayerMessage('Connecting to YouTube');
      return;
    }

    const playlistId = currentPlaylistId();
    resetPlayerElement();
    state.player = new YT.Player('yt-player', {
      width: '100%',
      height: '100%',
      playerVars: {
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
        enablejsapi: 1,
        fs: 1,
        origin: window.location.origin,
      },
      events: {
        onReady: () => {
          if (token !== state.loadToken) return;
          state.playerReady = true;
          enableBackgroundPlayback();
          try {
            const tracks = seededTrackIds();
            if (tracks.length){
              finishPlaylistLoad(tracks, token);
              return;
            }
            state.player.cuePlaylist({ listType: 'playlist', list: playlistId, index: 0, startSeconds: 0 });
            waitForPlaylist(token);
          } catch {
            failPlaylist('Could not start YouTube');
          }
        },
        onStateChange: onPlayerState,
        onError: onPlayerError,
      },
    });
  }

  function loadPlaylist(index){
    if (state.pollTimer){
      clearInterval(state.pollTimer);
      state.pollTimer = 0;
    }

    state.playlistIndex = index;
    state.videoIds = [];
    state.activeIndex = -1;
    state.isPlaying = false;
    state.shouldPlay = false;
    state.isLoading = true;
    state.loadedVideoId = '';
    state.query = '';
    state.loadToken += 1;
    els.searchInput.value = '';

    const playlist = currentPlaylist();
    setAccent(playlist.color);
    setStatus(`Loading ${playlist.name}`);
    showPlayerMessage(`Loading ${playlist.name}`);
    repaint();

    const token = state.loadToken;
    if (!state.apiReady){
      setStatus('Connecting');
      return;
    }
    createPlayerForPlaylist(token);
  }

  function waitForPlaylist(token){
    let tries = 0;
    let bestIds = [];
    let stableTicks = 0;
    state.pollTimer = window.setInterval(() => {
      if (token !== state.loadToken){
        clearInterval(state.pollTimer);
        return;
      }

      tries += 1;
      let ids = [];
      try {
        ids = (state.player.getPlaylist && state.player.getPlaylist()) || [];
      } catch {
        ids = [];
      }

      ids = ids.filter(id => typeof id === 'string' && id.length > 4);
      if (ids.length){
        if (ids.join('|') === bestIds.join('|')){
          stableTicks += 1;
        } else {
          bestIds = ids;
          stableTicks = 0;
          setStatus(`Loading ${ids.length} tracks`);
        }

        if ((bestIds.length > 1 && stableTicks >= 4) || (tries >= 36 && stableTicks >= 4)){
          finishPlaylistLoad(bestIds, token);
          return;
        }
      }

      if (tries >= 80){
        clearInterval(state.pollTimer);
        state.pollTimer = 0;
        if (bestIds.length){
          finishPlaylistLoad(bestIds, token);
        } else {
          failPlaylist('Could not load playlist');
        }
      }
    }, 250);
  }

  function finishPlaylistLoad(ids, token){
    clearInterval(state.pollTimer);
    state.pollTimer = 0;
    state.videoIds = ids;
    state.activeIndex = 0;
    state.isLoading = false;
    state.isPlaying = false;
    state.loadedVideoId = '';
    setStatus(`${ids.length} ${ids.length === 1 ? 'track' : 'tracks'}`, 'ok');
    showPlayerMessage('');
    updateProgress();
    repaint();
    hydrateMetadata(ids, token);
  }

  function failPlaylist(message){
    state.isLoading = false;
    state.videoIds = [];
    state.activeIndex = -1;
    state.isPlaying = false;
    state.shouldPlay = false;
    state.loadedVideoId = '';
    setStatus(message, 'error');
    showPlayerMessage(message, 'error');
    updateProgress();
    repaint();
  }

  async function hydrateMetadata(ids, token){
    let cursor = 0;
    const workerCount = Math.min(6, ids.length);
    const workers = Array.from({ length: workerCount }, async () => {
      while (cursor < ids.length && token === state.loadToken){
        const index = cursor;
        cursor += 1;
        await loadTrackMetadata(ids[index], index, token);
      }
    });

    await Promise.allSettled(workers);
    if (token === state.loadToken){
      updateNowPlaying();
      renderTracks();
    }
  }

  async function loadTrackMetadata(id, index, token){
    const existing = state.tracks.get(id);
    if (existing && existing.ready) return;

    state.tracks.set(id, { ...fallbackTrack(id, index), loading: true });

    try {
      const watchUrl = `https://www.youtube.com/watch?v=${id}`;
      const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(watchUrl)}&format=json`);
      if (!response.ok) throw new Error('oEmbed failed');
      const data = await response.json();
      state.tracks.set(id, {
        id,
        title: data.title || `Track ${index + 1}`,
        author: data.author_name || 'YouTube',
        ready: true,
        unavailable: false,
      });
    } catch {
      state.tracks.set(id, {
        ...fallbackTrack(id, index),
        ready: true,
        metaError: true,
      });
    }

    if (token === state.loadToken){
      updateNowPlaying();
      renderTracks();
    }
  }

  function syncActiveIndex(){
    if (!state.player || !state.player.getPlaylistIndex) return state.activeIndex;
    const nextIndex = state.player.getPlaylistIndex();
    if (Number.isInteger(nextIndex) && nextIndex >= 0 && nextIndex < state.videoIds.length){
      state.activeIndex = nextIndex;
    }
    return state.activeIndex;
  }

  function formatTime(seconds){
    const safeSeconds = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
    const minutes = Math.floor(safeSeconds / 60);
    const rest = String(safeSeconds % 60).padStart(2, '0');
    return `${minutes}:${rest}`;
  }

  function updateProgress(){
    let current = 0;
    let duration = 0;
    try {
      if (state.player && state.player.getCurrentTime) current = state.player.getCurrentTime() || 0;
      if (state.player && state.player.getDuration) duration = state.player.getDuration() || 0;
    } catch {
      current = 0;
      duration = 0;
    }

    els.currentTime.textContent = formatTime(current);
    els.duration.textContent = formatTime(duration);
    if (!state.isSeeking){
      els.seekBar.value = duration > 0 ? String(Math.min(1000, Math.round((current / duration) * 1000))) : '0';
    }
    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && duration > 0){
      try {
        navigator.mediaSession.setPositionState({
          duration,
          playbackRate: 1,
          position: Math.min(duration, Math.max(0, current)),
        });
      } catch {
        /* older WebKit rejects incomplete position state */
      }
    }
  }

  function seekBy(seconds){
    try {
      if (!state.player || !state.player.seekTo) return;
      const current = state.player.getCurrentTime ? state.player.getCurrentTime() || 0 : 0;
      const duration = state.player.getDuration ? state.player.getDuration() || 0 : 0;
      const target = duration > 0
        ? Math.min(duration, Math.max(0, current + seconds))
        : Math.max(0, current + seconds);
      state.player.seekTo(target, true);
      updateProgress();
    } catch {
      window.__surErrors.push('Could not seek');
    }
  }

  function seekToTime(seconds){
    try {
      if (!state.player || !state.player.seekTo) return;
      const duration = state.player.getDuration ? state.player.getDuration() || 0 : 0;
      const target = duration > 0 ? Math.min(duration, Math.max(0, seconds)) : Math.max(0, seconds);
      state.player.seekTo(target, true);
      updateProgress();
    } catch {
      window.__surErrors.push('Could not seek');
    }
  }

  function startProgressTimer(){
    if (state.progressTimer) return;
    state.progressTimer = window.setInterval(updateProgress, 500);
  }

  function stopProgressTimer(){
    if (!state.progressTimer) return;
    clearInterval(state.progressTimer);
    state.progressTimer = 0;
  }

  function playTrack(index){
    if (!state.playerReady || !state.videoIds[index]) return;

    const id = state.videoIds[index];
    state.activeIndex = index;
    state.isPlaying = true;
    state.shouldPlay = true;
    state.loadedVideoId = id;
    claimPlaybackSession();
    setStatus(`${state.videoIds.length} tracks`, 'ok');
    showPlayerMessage('');
    els.seekBar.value = '0';
    els.currentTime.textContent = '0:00';
    repaint();

    try {
      if (state.player.loadVideoById){
        state.player.loadVideoById(id);
      } else if (state.player.loadVideoByUrl){
        state.player.loadVideoByUrl(`https://www.youtube.com/watch?v=${id}`);
      } else if (state.player.playVideoAt){
        state.player.playVideoAt(index);
      }
      startProgressTimer();
    } catch {
      setStatus('Could not play track', 'error');
      state.isPlaying = false;
      state.shouldPlay = false;
      repaint();
    }
  }

  function togglePlay(){
    if (!state.playerReady || !state.player) return;
    if (!state.videoIds.length) return;

    if (state.isPlaying){
      state.shouldPlay = false;
      state.player.pauseVideo && state.player.pauseVideo();
      return;
    }

    state.shouldPlay = true;
    claimPlaybackSession();

    if (state.activeIndex < 0){
      playTrack(0);
      return;
    }

    const id = state.videoIds[state.activeIndex];
    if (state.loadedVideoId !== id){
      playTrack(state.activeIndex);
      return;
    }

    try {
      state.player.playVideo && state.player.playVideo();
      state.isPlaying = true;
      startProgressTimer();
      repaint();
    } catch {
      playTrack(state.activeIndex);
    }
  }

  function nextTrack(){
    if (!state.videoIds.length) return;
    const next = state.activeIndex < 0 ? 0 : (state.activeIndex + 1) % state.videoIds.length;
    playTrack(next);
  }

  function previousTrack(){
    if (!state.videoIds.length) return;
    const previous = state.activeIndex <= 0 ? state.videoIds.length - 1 : state.activeIndex - 1;
    playTrack(previous);
  }

  function onPlayerState(event){
    if (!window.YT || !window.YT.PlayerState) return;
    const playerState = window.YT.PlayerState;

    if (event.data === playerState.PLAYING){
      syncActiveIndex();
      state.isPlaying = true;
      setStatus(`${state.videoIds.length} tracks`, 'ok');
      showPlayerMessage('');
      startProgressTimer();
    } else if (event.data === playerState.PAUSED || event.data === playerState.ENDED){
      syncActiveIndex();
      state.isPlaying = false;
      updateProgress();
      if (event.data === playerState.ENDED && state.videoIds.length > 1){
        nextTrack();
        return;
      }
      if (event.data === playerState.ENDED) state.shouldPlay = false;
    } else if (event.data === playerState.CUED){
      syncActiveIndex();
      state.isPlaying = false;
      updateProgress();
    } else if (event.data === playerState.BUFFERING){
      syncActiveIndex();
      updateProgress();
    }

    repaint();
  }

  function onPlayerError(){
    if (state.isLoading || !state.videoIds.length){
      return;
    }

    const index = syncActiveIndex();
    const id = state.videoIds[index];
    if (id){
      const track = getTrack(id, index);
      state.tracks.set(id, { ...track, unavailable: true, ready: true });
    }
    state.isPlaying = false;
    setStatus('Track unavailable', 'warn');
    repaint();
    if (state.videoIds.length > 1){
      window.setTimeout(nextTrack, 700);
    }
  }

  function onYouTubeIframeAPIReady(){
    state.apiReady = true;
    loadPlaylist(state.playlistIndex);
  }

  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  els.searchInput.addEventListener('input', () => {
    state.query = els.searchInput.value;
    renderTracks();
  });
  els.playBtn.addEventListener('click', togglePlay);
  els.nextBtn.addEventListener('click', nextTrack);
  els.prevBtn.addEventListener('click', previousTrack);
  els.seekBar.addEventListener('input', () => {
    state.isSeeking = true;
    let duration = 0;
    try {
      duration = state.player && state.player.getDuration ? state.player.getDuration() || 0 : 0;
    } catch {
      duration = 0;
    }
    els.currentTime.textContent = formatTime((Number(els.seekBar.value) / 1000) * duration);
  });
  els.seekBar.addEventListener('change', () => {
    let duration = 0;
    try {
      duration = state.player && state.player.getDuration ? state.player.getDuration() || 0 : 0;
      if (duration > 0 && state.player.seekTo){
        state.player.seekTo((Number(els.seekBar.value) / 1000) * duration, true);
      }
    } catch {
      duration = 0;
    }
    state.isSeeking = false;
    updateProgress();
  });

  function setMediaAction(action, handler){
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.setActionHandler(action, handler);
    } catch {
      window.__surErrors.push(`Media action unsupported: ${action}`);
    }
  }

  setMediaAction('play', () => {
    state.shouldPlay = true;
    claimPlaybackSession();
    if (state.isPlaying) return;
    togglePlay();
  });
  setMediaAction('pause', () => {
    state.shouldPlay = false;
    if (state.player && state.player.pauseVideo) state.player.pauseVideo();
  });
  setMediaAction('previoustrack', previousTrack);
  setMediaAction('nexttrack', nextTrack);
  setMediaAction('seekbackward', previousTrack);
  setMediaAction('seekforward', nextTrack);
  setMediaAction('seekto', event => {
    if (event.fastSeek && state.player && state.player.seekTo){
      state.player.seekTo(event.seekTime || 0, true);
      updateProgress();
      return;
    }
    seekToTime(event.seekTime || 0);
  });

  function onForeground(){
    syncMediaSessionPlaybackState();
    updateProgress();
    resumePlaybackIfNeeded();
  }

  document.addEventListener('visibilitychange', () => {
    claimPlaybackSession();
    syncMediaSessionPlaybackState();
    if (document.hidden){
      resumePlaybackIfNeeded();
      return;
    }
    onForeground();
  });
  window.addEventListener('pageshow', onForeground);
  window.addEventListener('focus', onForeground);
  document.addEventListener('resume', onForeground);

  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (els.iosHint && isIOS && /CriOS/.test(ua)) els.iosHint.classList.add('is-on');

  renderTabs();
  renderLoadingRows();
  renderShell();

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.async = true;
  tag.onerror = () => {
    state.apiReady = false;
    state.playerReady = false;
    state.isLoading = false;
    setStatus('YouTube unavailable', 'error');
    showPlayerMessage('YouTube unavailable', 'error');
    repaint();
  };
  document.body.appendChild(tag);

  window.setTimeout(() => {
    if (!state.apiReady){
      setStatus('Still connecting');
      showPlayerMessage('Connecting to YouTube');
    }
  }, 5000);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
